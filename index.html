<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Pokémon Quiz</title>
</head>
<body>

    <h1 id="titulo">Pokémon Quiz</h1> <br> <br>

 <!--  OS NÍVEIS DE DIFICULDADE ESTARÃO INDISPONÍVEIS NO MOMENTO ENQUANTO O JOGO NÃO ESTIVER FUNCIONANDO CORRETAMENTE
    
    <h2 id="nivel-dificuldade">Selecione o nível de dificuldade: </h2> <br> <br>

    <img class="img-dificuldade" src="./imagens-gerais/green-background-texto.png" alt="Nível Fácil"> <br>

    <img class="img-dificuldade" src="./imagens-gerais/grey-background-texto.png" alt="Nível Médio"> <br>

    <img class="img-dificuldade" src="./imagens-gerais/red-background-texto.png" alt="Nível Difícil">  -->

    <h2 class="pergunta" >Qual desses é o Charmander?</h2>
    <p id="pontuacao"></p>

    <div class="alternativas">
        <img class="alternativa"
            src="./imagens-pokemon/magmar.webp"
            alt="">

        <img class="alternativa"
            src="./imagens-pokemon/arcanine.webp"
            alt="">

        <img class="alternativa"
            src="./imagens-pokemon/charmander.webp"
            alt="">

        <img class="alternativa"
            src="./imagens-pokemon/flareon.webp"
            alt="">
    </div>

    <p id="resultado" aria-live="polite"></p>

    <div id="fim-de-jogo" hidden>
        <h2>Fim de jogo!</h2>
        <p id="pontuacao-final"></p>
        <p id="mensagem-final"></p>
        <button id="reiniciar-jogo"> Jogar novamente </button>
    </div>

    <button id="proxima-pergunta" hidden>
        Próxima pergunta
    </button>

    <script src="script.js"></script>

</body>
</html>
